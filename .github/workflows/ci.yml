name: Framework CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Validate framework structure
        run: |
          chmod +x scripts/check-framework.sh
          ./scripts/check-framework.sh

      - name: Check shell syntax
        run: bash -n scripts/check-framework.sh
